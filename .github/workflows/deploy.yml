name: Deploy to FTP

on:
  push:
    branches:
      - master

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
    - name: 🚚 Get latest code
      uses: actions/checkout@v4

    - name: 🔐 Parse Credentials
      id: creds
      run: |
        # Parse "login=password" format
        SECRET="${{ secrets.keystoeko_kieszonkowe }}"
        if [[ "$SECRET" == *"="* ]]; then
          echo "FTP_USER=${SECRET%%=*}" >> $GITHUB_OUTPUT
          PASS="${SECRET#*=}"
          echo "FTP_PASS=$PASS" >> $GITHUB_OUTPUT
          echo "::add-mask::$PASS"
        else
          echo "FTP_USER=chalupy_www" >> $GITHUB_OUTPUT
          echo "FTP_PASS=$SECRET" >> $GITHUB_OUTPUT
          echo "::add-mask::$SECRET"
        fi

    - name: 🔍 Find Site Paths
      run: |
        # Use a python script to list everything since we can't reliably use native FTP commands in one-liners
        cat <<EOF > find_paths.py
        import ftplib
        ftp = ftplib.FTP('europ.iq.pl')
        ftp.login('${{ steps.creds.outputs.FTP_USER }}', '${{ steps.creds.outputs.FTP_PASS }}')
        def find_index(path):
            try:
                ftp.cwd(path)
                items = []
                ftp.dir(items.append)
                for i in items:
                    name = i.split()[-1]
                    if name in ('.', '..'): continue
                    full = f"{path}/{name}".replace("//", "/")
                    if "index.html" in name:
                        print(f"!!! FOUND INDEX: {full}")
                    if i.startswith('d'):
                        find_index(full)
                        ftp.cwd(path)
            except: pass
        find_index("/")
        ftp.quit()
        EOF
        python3 find_paths.py > ftp_structure.log
        cat ftp_structure.log

    - name: 🔐 Disconnect Sunset Timer (Clear Main site)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: europ.iq.pl
        username: ${{ steps.creds.outputs.FTP_USER }}
        password: ${{ steps.creds.outputs.FTP_PASS }}
        local-dir: ./empty_site/
        server-dir: /www/chalupy.online/
        dangerous-clean-slate: true

    - name: 📂 Sync Eko files
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: europ.iq.pl
        username: ${{ steps.creds.outputs.FTP_USER }}
        password: ${{ steps.creds.outputs.FTP_PASS }}
        local-dir: ./
        server-dir: /www/eko.chalupy.online/
        exclude: |
          **/.git*
          **/.git*/**
          **/node_modules/**
          .env
          converter.py
          feedpages.md
          slides_draft.md
          task.md
          empty_site/**
